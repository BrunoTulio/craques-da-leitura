/* Estilos Especializados de Acessibilidade para Dislexia e Tema de Futebol */
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Bungee&display=swap');

:root {
  --font-dyslexia: 'Lexend', system-ui, -apple-system, sans-serif;
  --font-title: 'Bungee', cursive, sans-serif;
  
  /* Cores de alto contraste e baixo estresse visual */
  --pitch-green: #0f5132;
  --pitch-light: #198754;
  --chalk-white: #f8fafc;
  --gold-cup: #f59e0b;
}

body {
  font-family: var(--font-dyslexia);
  letter-spacing: 0.04em;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* Títulos com estilo de transmissão esportiva */
.font-display {
  font-family: var(--font-title);
  letter-spacing: 0.06em;
}

/* Texto especial para leitura assistida de dislexia */
.reading-text {
  font-size: 1.45rem;
  letter-spacing: 0.08em;
  word-spacing: 0.25em;
  line-height: 2.1;
}

/* Cores de Sílabas Alternadas (reduz o efeito de "amontoamento" visual) */
.syl-0 { color: #0284c7; background-color: #e0f2fe; border-radius: 6px; padding: 2px 6px; margin: 0 2px; }
.syl-1 { color: #16a34a; background-color: #dcfce7; border-radius: 6px; padding: 2px 6px; margin: 0 2px; }
.syl-2 { color: #ea580c; background-color: #ffedd5; border-radius: 6px; padding: 2px 6px; margin: 0 2px; }
.syl-3 { color: #9333ea; background-color: #f3e8ff; border-radius: 6px; padding: 2px 6px; margin: 0 2px; }

/* Destaque especial para letras do fonema-alvo */
.target-phoneme-ch {
  color: #d97706;
  font-weight: 800;
  text-decoration: underline wavy #f59e0b 2px;
}
.target-phoneme-pt {
  color: #2563eb;
  font-weight: 800;
  border-bottom: 3px solid #3b82f6;
}
.target-phoneme-r {
  color: #059669;
  font-weight: 800;
  text-decoration: underline wavy #10b981 2px;
}
.target-phoneme-s {
  color: #7c3aed;
  font-weight: 800;
  border-bottom: 3px solid #8b5cf6;
}

/* Gramado do Estádio (Background do campo de futebol) */
.pitch-pattern {
  background: repeating-linear-gradient(
    to bottom,
    #15803d,
    #15803d 35px,
    #166534 35px,
    #166534 70px
  );
  position: relative;
  overflow: hidden;
}

/* Linhas de cal do campo */
.pitch-lines {
  background-image: 
    radial-gradient(circle at center, transparent 70px, rgba(255, 255, 255, 0.4) 70px, rgba(255, 255, 255, 0.4) 73px, transparent 73px),
    linear-gradient(to right, transparent calc(50% - 1.5px), rgba(255, 255, 255, 0.4) calc(50% - 1.5px), rgba(255, 255, 255, 0.4) calc(50% + 1.5px), transparent calc(50% + 1.5px));
}

/* Card estilo EA FC / Ultimate Team */
.craque-card {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border: 3px solid #fbbf24;
  box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.3), 0 8px 10px -6px rgba(245, 158, 11, 0.2);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.craque-card:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 20px 30px -10px rgba(245, 158, 11, 0.4);
}

/* Animação de Chute e Gol */
@keyframes goalBounce {
  0%, 100% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(1.2) rotate(-6deg); }
  50% { transform: scale(1.35) rotate(6deg); }
  75% { transform: scale(1.15) rotate(-3deg); }
}

.animate-goal {
  animation: goalBounce 0.8s ease-in-out infinite alternate;
}

/* Animação da Trave (vibração metálica) */
@keyframes crossbarShake {
  0% { transform: translateX(0); }
  20% { transform: translateX(-8px) rotate(-1deg); }
  40% { transform: translateX(8px) rotate(1deg); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

.animate-crossbar {
  animation: crossbarShake 0.5s ease-in-out;
}

/* Efeito de Prancheta Tática / Dica do VAR */
.tactical-board {
  background: #022c22;
  border: 3px dashed #34d399;
  position: relative;
}

/* Botões com alvos táteis generosos para crianças / tablet */
.touch-btn {
  min-height: 54px;
  min-width: 54px;
  touch-action: manipulation;
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

.touch-btn:active {
  transform: scale(0.95);
}


/* Estilos da Arena Interativa e Treinador Falante */
#match-canvas-container {
  position: relative;
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
  border: 4px solid #0f172a;
  background: #14532d;
}

#soccer-canvas, #soccer-canvas-match {
  width: 100%;
  height: auto;
  display: block;
  touch-action: none;
}

/* Balão do Treinador Falante */
.coach-bubble {
  background: #ffffff;
  border: 3px solid #f59e0b;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  position: relative;
}

.coach-bubble::after {
  content: '';
  position: absolute;
  left: 35px;
  bottom: -14px;
  border-width: 14px 14px 0;
  border-style: solid;
  border-color: #ffffff transparent;
  display: block;
  width: 0;
}

.coach-bubble::before {
  content: '';
  position: absolute;
  left: 33px;
  bottom: -18px;
  border-width: 16px 16px 0;
  border-style: solid;
  border-color: #f59e0b transparent;
  display: block;
  width: 0;
}

@keyframes coachTalk {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08) rotate(-3deg); }
}

.coach-talking {
  animation: coachTalk 0.5s infinite ease-in-out;
}

/* Régua de Leitura Dinâmica para Dislexia */
.reading-ruler-guide {
  position: relative;
  border-left: 6px solid #f59e0b;
  background: linear-gradient(90deg, rgba(254, 243, 199, 0.9) 0%, rgba(254, 243, 199, 0.45) 100%);
  border-radius: 12px;
  padding: 8px 14px;
  box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
}

/* Cartas do Álbum dos Craques */
.card-legendary {
  background: radial-gradient(circle at 50% 0%, #fef08a 0%, #ca8a04 40%, #713f12 100%);
  border: 3px solid #fde047;
  box-shadow: 0 12px 30px -5px rgba(234, 179, 8, 0.6);
}

.card-rare {
  background: radial-gradient(circle at 50% 0%, #93c5fd 0%, #2563eb 50%, #1e3a8a 100%);
  border: 3px solid #60a5fa;
  box-shadow: 0 12px 30px -5px rgba(37, 99, 235, 0.5);
}

.card-common {
  background: radial-gradient(circle at 50% 0%, #6ee7b7 0%, #059669 50%, #064e3b 100%);
  border: 3px solid #34d399;
  box-shadow: 0 12px 25px -5px rgba(5, 150, 105, 0.4);
}

.card-locked {
  background: #1e293b;
  border: 2px dashed #475569;
  opacity: 0.7;
}

@keyframes packShake {
  0%, 100% { transform: rotate(0deg) scale(1); }
  20% { transform: rotate(-6deg) scale(1.05); }
  40% { transform: rotate(6deg) scale(1.08); }
  60% { transform: rotate(-6deg) scale(1.1); }
  80% { transform: rotate(6deg) scale(1.12); }
}

.pack-anim {
  animation: packShake 0.6s infinite ease-in-out;
}

@keyframes cardPop {
  0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
  70% { transform: scale(1.1) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.card-reveal-anim {
  animation: cardPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

/* Tabelinha de Sílabas (Lance 4) */
.syllable-node {
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 6px 16px -2px rgba(0, 0, 0, 0.2);
}

.syllable-node:hover {
  transform: translateY(-3px) scale(1.05);
}

.syllable-node.active-pass {
  background: linear-gradient(135deg, #10b981 0%, #047857 100%) !important;
  color: #ffffff !important;
  border-color: #34d399 !important;
  transform: scale(1.08);
  box-shadow: 0 0 20px rgba(52, 211, 153, 0.6) !important;
}

        console.warn('Speech init error:', e);
      }
    }

    unlockAudio() {
      this.audioUnlocked = true;
      try {
        const ctx = this.getAudioContext();
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.resume();
        }
      } catch (e) {
        console.warn('Audio unlock error:', e);
      }
    }

    getAudioContext() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      return this.ctx;
    }

    initSpeech() {
      if (!('speechSynthesis' in window)) return;

      const pickVoice = () => {
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return;

        // Procura voz brasileira (Google, natural ou padrão)
        this.speechVoice = voices.find(v => (v.lang === 'pt-BR' || v.lang === 'pt_BR') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Brazil')))
          || voices.find(v => v.lang === 'pt-BR' || v.lang === 'pt_BR')
          || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('pt'))
          || voices.find(v => v.name && v.name.toLowerCase().includes('portuguese'))
          || voices[0];

        console.log('Voz selecionada:', this.speechVoice ? `${this.speechVoice.name} (${this.speechVoice.lang})` : 'Nenhuma');
      };

      pickVoice();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = pickVoice;
      }
    }

    setSpeechRate(rate) {
      this.speechRate = Math.max(0.5, Math.min(1.5, rate));
    }

    stopSpeaking() {
      // 1. Cancelar fala pendente
      if (this.pendingSpeechTimer) {
        clearTimeout(this.pendingSpeechTimer);
        this.pendingSpeechTimer = null;
      }

      // 2. Parar áudio HTML5 <audio>
      if (this.currentAudio) {
        try {
          this.currentAudio.pause();
          this.currentAudio.currentTime = 0;
          this.currentAudio.onplay = null;
          this.currentAudio.onended = null;
          this.currentAudio.onerror = null;
          this.currentAudio.src = '';
        } catch(e) {}
        this.currentAudio = null;
      }

      // 3. Parar sintetizador do navegador
      if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
        } catch(e) {}
      }

      this.isSpeaking = false;
    }

    speak(text, priorityRate = null) {
      if (this.isMuted) return;
      if (!text || typeof text !== 'string') return;
      const cleanText = text.trim();
      if (!cleanText) return;

      this.unlockAudio();
      this.stopSpeaking();

      // Gerador de ID para evitar conflitos de corridas/duas vozes simultâneas
      this.speechCounter = (this.speechCounter || 0) + 1;
      const thisId = this.speechCounter;

      // MOTOR 1: Áudio Nativo de Alta Definição em Português Brasileiro (Google TTS stream)
      try {
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=pt-BR&client=tw-ob&q=${encodeURIComponent(cleanText)}`;
        const audio = new Audio(url);
        audio.playbackRate = priorityRate || this.speechRate || 1.0;
        this.currentAudio = audio;
        this.isSpeaking = true;

        let playbackStarted = false;

        audio.onplay = () => {
          if (this.speechCounter !== thisId) {
            audio.pause();
            return;
          }
          playbackStarted = true;
          this.isSpeaking = true;
        };

        audio.onended = () => {
          if (this.currentAudio === audio) {
            this.currentAudio = null;
            this.isSpeaking = false;
          }
        };

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            console.log('✅ Narração tocando com sucesso (Áudio HD):', cleanText);
          }).catch(err => {
            if (!playbackStarted && this.speechCounter === thisId) {
              console.warn('Áudio HD bloqueado, usando voz local:', err);
              this.currentAudio = null;
              this.speakLocalSpeechSynthesis(cleanText, priorityRate, thisId);
            }
          });
        }

        audio.onerror = () => {
          if (!playbackStarted && this.speechCounter === thisId) {
            console.warn('Erro ao carregar áudio HD, acionando sintetizador local...');
            this.currentAudio = null;
            this.speakLocalSpeechSynthesis(cleanText, priorityRate, thisId);
          }
        };
        return;
      } catch (err) {
        if (this.speechCounter === thisId) {
          console.warn('Erro no motor HD:', err);
          this.currentAudio = null;
          this.speakLocalSpeechSynthesis(cleanText, priorityRate, thisId);
        }
      }
    }

    // MOTOR 2 (FALLBACK): Web Speech API do navegador
    speakLocalSpeechSynthesis(text, priorityRate = null, expectedId = null) {
      if (expectedId !== null && this.speechCounter !== expectedId) return;
      if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = priorityRate || this.speechRate || 1.0;
        utterance.pitch = this.speechPitch || 1.0;

        if (this.speechVoice) {
          utterance.voice = this.speechVoice;
        }

        utterance.onend = () => {
          this.isSpeaking = false;
        };
        utterance.onerror = () => {
          this.isSpeaking = false;
        };

        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.error('Fallback SpeechSynthesis falhou:', e);
      }
    }

    speakSyllables(syllablesArray) {
      if (this.isMuted) return;
      const textWithPauses = syllablesArray.join(' ... ');
      this.speak(textWithPauses, 0.72);
    }


    // ================= SÍNTESE ACÚSTICA FONOLÓGICA (WEB AUDIO API - 100% GARANTIDO) =================
    // Sintetiza diretamente a forma de onda do som do fonema (funciona em qualquer Linux/Browser)

    // 1. Fonema CH (/ʃ/) - Ruído chiado contínuo com ataque suave
    playPhonemeCH() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const bufferSize = ctx.sampleRate * 0.8;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.35;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(3200, ctx.currentTime);
      filter.Q.setValueAtTime(2.5, ctx.currentTime);
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.6, now + 0.15);
      gain.gain.linearRampToValueAtTime(0.5, now + 0.55);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 0.82);
    }

    // 2. Fonema P (/p/) - Oclusiva bilabial surda (estouro grave nos lábios)
    playPhonemeP() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      const now = ctx.currentTime;
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.08);
      gain.gain.setValueAtTime(0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    // 3. Fonema T (/t/) - Oclusiva alveolar surda (toque agudo da língua nos dentes)
    playPhonemeT() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      const now = ctx.currentTime;
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.exponentialRampToValueAtTime(350, now + 0.05);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }

    // 4. Fonema R Vibrante (/r/) - Motorzinho com vibração da ponta da língua (tremolo a 26Hz)
    playPhonemeR() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      // Tremolo vibrante
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.setValueAtTime(28, now); // 28 vibrações por segundo
      lfoGain.gain.setValueAtTime(0.4, now);
      lfo.connect(lfoGain.gain);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0.5, now + 0.1);
      gain.gain.linearRampToValueAtTime(0.4, now + 0.6);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      lfo.start(now);
      osc.stop(now + 0.88);
      lfo.stop(now + 0.88);
    }

    // 5. Fonema S (/s/) - Sibilante contínua aguda (o sopro da torcida)
    playPhonemeS() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const bufferSize = ctx.sampleRate * 0.75;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.3;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(5500, ctx.currentTime);
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.55, now + 0.1);
      gain.gain.linearRampToValueAtTime(0.45, now + 0.5);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 0.78);
    }

    // Tocar o som fonológico de acordo com o fonema
    playPhonemeAcoustic(phonemeKey) {
      this.unlockAudio();
      if (phonemeKey === 'CH') this.playPhonemeCH();
      else if (phonemeKey === 'P_VS_T') {
        this.playPhonemeP();
        setTimeout(() => this.playPhonemeT(), 350);
      } else if (phonemeKey === 'R_VIBRANTE') this.playPhonemeR();
      else if (phonemeKey === 'S') this.playPhonemeS();
    }

    playKick() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      const now = ctx.currentTime;
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(32, now + 0.12);
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }

    playWhistle() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const playPip = (start, duration, freq) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, start);
        osc.frequency.linearRampToValueAtTime(freq + 40, start + duration * 0.5);
        osc.frequency.linearRampToValueAtTime(freq, start + duration);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.4, start + 0.02);
        gain.gain.linearRampToValueAtTime(0.3, start + duration - 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + duration);
      };
      const now = ctx.currentTime;
      playPip(now, 0.12, 2800);
      playPip(now + 0.16, 0.28, 2900);
    }

    playCrossbar() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const frequencies = [520, 1140, 1850, 2400];
      frequencies.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        const amp = 0.3 / (idx + 1);
        gain.gain.setValueAtTime(amp, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8 + idx * 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.2);
      });
    }

    playGoalCheer() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const bufferSize = ctx.sampleRate * 2.5;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99 * b0 + white * 0.05;
        b1 = 0.95 * b1 + white * 0.08;
        b2 = 0.85 * b2 + white * 0.15;
        data[i] = (b0 + b1 + b2) * 0.4;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(650, ctx.currentTime);
      filter.Q.setValueAtTime(1.2, ctx.currentTime);
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0.65, now + 0.3);
      gain.gain.linearRampToValueAtTime(0.4, now + 1.8);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 2.5);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 2.5);
      this.playCelebrationFanfare();
    }

    playCelebrationFanfare() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const notes = [
        { f: 523.25, t: 0.0, d: 0.15 },
        { f: 659.25, t: 0.15, d: 0.15 },
        { f: 783.99, t: 0.30, d: 0.20 },
        { f: 1046.50, t: 0.50, d: 0.50 }
      ];
      const now = ctx.currentTime;
      notes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now + n.t);
        gain.gain.setValueAtTime(0, now + n.t);
        gain.gain.linearRampToValueAtTime(0.3, now + n.t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + n.d + 0.05);
      });
    }

    playTacticalHint() {
      if (this.isMuted) return;
      const ctx = this.getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.25, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    }
  }

    state.training.hintActive = false;
    state.training.eliminatedDistractors = [];

    const pool = WORDS_DATABASE.filter(w => w.phoneme === phonemeKey);
    // Embaralhar para o treino ser sempre variado
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    state.training.questions = shuffled.slice(0, 6);

    const pInfo = PHONEMES_INFO[phonemeKey];
    setTimeout(() => {
      sound.speak(`${pInfo.title}. ${pInfo.coachQuote}`);
    }, 400);
  }

  function checkTrainingAnswer(selectedOption) {
    if (state.training.answered || state.training.isKicking) return;

    state.training.isKicking = true;
    setTimeout(() => {
      state.training.isKicking = false;
    }, 2800);

    const currentQ = state.training.questions[state.training.currentQuestionIndex];
    const phoneme = currentQ.phoneme;
    state.stats.totalExercises++;
    state.stats.byPhoneme[phoneme].total++;

    if (selectedOption === currentQ.missingPart) {
      if (activeSoccerCanvas) {
        activeSoccerCanvas.shootGoal(() => {
          state.training.answered = true;
          state.training.isKicking = false;
          if (!state.training.hintActive) {
            state.stats.firstTryCorrect++;
            state.stats.byPhoneme[phoneme].correctFirstTry++;
            state.player.stars += 3;
            state.player.xp += 30;
          } else {
            state.player.stars += 2;
            state.player.xp += 20;
          }
          saveState();
          render();
          sound.speak(`Golaço espetacular! A palavra é ${currentQ.word}!`);
        });
      } else {
        state.training.answered = true;
        state.training.isKicking = false;
        sound.playGoalCheer();
        saveState();
        render();
      }
    } else {
      const isGoalkeeperSave = Math.random() > 0.4;
      state.stats.byPhoneme[phoneme].errors++;
      state.stats.recentMistakes.unshift({
        word: currentQ.word,
        attempted: selectedOption,
        phoneme: phoneme,
        date: 'Agora'
      });
      if (state.stats.recentMistakes.length > 8) state.stats.recentMistakes.pop();
      saveState();

      if (!state.training.eliminatedDistractors.includes(selectedOption)) {
        state.training.eliminatedDistractors.push(selectedOption);
      }

      // Feedback fonoaudiológico específico do distrator escolhido!
      const specificExplanation = (currentQ.hint && currentQ.hint.distractorExplanations && currentQ.hint.distractorExplanations[selectedOption]) || '';

      if (activeSoccerCanvas) {
        const onDone = () => {
          state.training.isKicking = false;
          render();
          if (specificExplanation) {
            sound.speak(`Foi na trave! ${specificExplanation}`);
          } else if (isGoalkeeperSave) {
            sound.speak(`Que defesaça do goleiro! Tente outra alternativa ou peça a dica do VAR!`);
          } else {
            sound.speak(`Foi na trave! A bola voltou para o campo. Tente outra alternativa!`);
          }
        };

        if (isGoalkeeperSave) {
          activeSoccerCanvas.shootGoalkeeperSave(onDone);
        } else {
          state.stats.crossbarHits++;
          activeSoccerCanvas.shootCrossbar(onDone);
        }
      } else {
        state.training.isKicking = false;
        sound.playCrossbar();
        render();
      }
    }
  }

  function activateTrainingHint() {
    state.training.hintActive = true;
    state.stats.hintsUsed++;

    const currentQ = state.training.questions[state.training.currentQuestionIndex];
    const pInfo = PHONEMES_INFO[state.training.selectedPhoneme];

    let eliminatedOne = null;
    if (currentQ.hint && currentQ.hint.varEliminate) {
      const extra = currentQ.hint.varEliminate.find(d => !state.training.eliminatedDistractors.includes(d));
      if (extra) {
        state.training.eliminatedDistractors.push(extra);
        eliminatedOne = extra;
      }
    }

    const soundCue = currentQ.hint ? currentQ.hint.soundCue : pInfo.soundDescription;
    const articulatoryCue = currentQ.hint ? currentQ.hint.articulatoryCue : pInfo.articulatoryTip;

    showVarModal('DICA DO TÉCNICO • CENTRO DE TREINAMENTO', soundCue, articulatoryCue, eliminatedOne);
    render();
  }

  function nextTrainingQuestion() {
    state.training.currentQuestionIndex++;
    state.training.answered = false;
    state.training.hintActive = false;
    state.training.eliminatedDistractors = [];

    if (state.training.currentQuestionIndex >= state.training.questions.length) {
      // Treino concluído! Recompensa de pacote de figurinhas a cada finalização
      state.player.stars += 5;
      state.player.packsAvailable++;
      saveState();
      sound.playWhistle();
      setTimeout(() => {
        sound.speak(`Fim de treino excelente! Você ganhou mais 5 estrelas e um novo Pacotinho de Figurinhas!`);
      }, 500);
      navigateTo('training_list');
    } else {
      render();
    }
  }

  // ================= MODO CAMPEONATO DIVERSIFICADO =================
  const MATCH_STAGE_TITLES = [
    { name: '1. Roubada de Bola', desc: 'Desarme no meio-campo! Identifique o som inicial correto.', icon: '🛡️', type: 'initial_sound' },
    { name: '2. Passe Preciso', desc: 'Lance em profundidade! Complete com a sílaba certa.', icon: '🎯', type: 'missing_syllable' },
    { name: '3. Drible Desconcertante', desc: 'Duelo no mano a mano! Escolha o drible certo ao ouvir o narrador.', icon: '⚡', type: 'minimal_pair' },
    { name: '4. Cruzamento na Área', desc: 'Tabelinha de passes! Toque nas sílabas na ordem para cruzar na área.', icon: '⚽', type: 'syllable_shuffle' },
    { name: '5. Chute a Gol!', desc: 'Cara a cara com o goleiro! Complete a narração e balance as redes!', icon: '🏆', type: 'full_sentence' }
  ];

  function initMatchGame(championshipId) {
    const champ = CHAMPIONSHIPS.find(c => c.id === championshipId) || CHAMPIONSHIPS[0];
    state.match.championship = champ;
    state.match.playStage = 0;
    state.match.homeScore = 0;
    state.match.awayScore = 0;
    state.match.stageAnswered = false;
    state.match.matchFinished = false;
    state.match.hintActive = false;
    state.match.eliminatedDistractors = [];

    loadMatchStageChallenge();
    setTimeout(() => {
      sound.playWhistle();
      setTimeout(() => {
        sound.speak(`Começa o grande jogo no ${champ.stadium}! ${state.player.name} contra ${champ.opponent}!`);
      }, 700);
    }, 300);
  }

  function loadMatchStageChallenge() {
    state.match.stageAnswered = false;
    state.match.hintActive = false;
    state.match.eliminatedDistractors = [];

    const stage = state.match.playStage;
    const stageInfo = MATCH_STAGE_TITLES[stage] || MATCH_STAGE_TITLES[0];
    state.match.stageType = stageInfo.type;

    const phonemeKeys = ['CH', 'P_VS_T', 'R_VIBRANTE', 'S'];
    const targetPhoneme = phonemeKeys[stage % phonemeKeys.length];
    const candidates = WORDS_DATABASE.filter(w => w.phoneme === targetPhoneme);
    const challenge = candidates[Math.floor(Math.random() * candidates.length)] || WORDS_DATABASE[0];
    state.match.currentChallenge = challenge;

    // Configuração específica por mecânica
    if (stageInfo.type === 'initial_sound') {
      const target = challenge.initialSound || challenge.missingPart;
      const distractorPool = ['CH', 'P', 'T', 'R', 'S', 'B', 'C', 'M', 'F'].filter(x => x !== target);
      const shuffledDistractors = distractorPool.sort(() => Math.random() - 0.5).slice(0, 3);
      state.match.challengeOptions = [target, ...shuffledDistractors].sort();
    } else if (stageInfo.type === 'missing_syllable') {
      state.match.challengeOptions = [challenge.missingPart, ...challenge.distractors].sort();
    } else if (stageInfo.type === 'minimal_pair') {
      const target = challenge.word;
      const pair = (challenge.minimalPair && challenge.minimalPair[1]) ? challenge.minimalPair[1] : (challenge.distractors[0] + challenge.word.slice(2));
      const otherWords = WORDS_DATABASE.filter(w => w.word !== target && w.word !== pair).map(w => w.word).sort(() => Math.random() - 0.5).slice(0, 2);
      state.match.challengeOptions = [target, pair, ...otherWords].sort();
      // O narrador fala a palavra automaticamente para o desafio auditivo
      setTimeout(() => {
        sound.speak(`Atenção no drible: toque para a jogada ${target}!`);
      }, 600);
    } else if (stageInfo.type === 'syllable_shuffle') {
      state.match.syllablesTarget = [...challenge.syllables];
      state.match.syllablesSequence = [];
      let shuffled = [...challenge.syllables].sort(() => Math.random() - 0.5);
      if (shuffled.join('') === challenge.syllables.join('') && shuffled.length > 1) {
        shuffled.reverse();
      }
      state.match.syllablesShuffled = shuffled;
    } else if (stageInfo.type === 'full_sentence') {
      state.match.challengeOptions = [challenge.missingPart, ...challenge.distractors].sort();
    }
  }

  function checkMatchAnswer(option) {
    if (state.match.stageAnswered || state.match.isKicking) return;

    state.match.isKicking = true;
    setTimeout(() => {
      state.match.isKicking = false;
    }, 2800);

    const challenge = state.match.currentChallenge;
    const stageType = state.match.stageType;

    let isCorrect = false;
    if (stageType === 'initial_sound') {
      isCorrect = (option === (challenge.initialSound || challenge.missingPart));
    } else if (stageType === 'minimal_pair') {
      isCorrect = (option === challenge.word);
    } else {
      isCorrect = (option === challenge.missingPart);
    }

    state.stats.totalExercises++;
    state.stats.byPhoneme[challenge.phoneme].total++;

    if (isCorrect) {
      if (activeSoccerCanvas) {
        activeSoccerCanvas.shootGoal(() => {
          state.match.stageAnswered = true;
          state.match.isKicking = false;
          if (!state.match.hintActive) {
            state.stats.firstTryCorrect++;
            state.stats.byPhoneme[challenge.phoneme].correctFirstTry++;
          }
          if (state.match.playStage === 4) {
            state.match.homeScore++;
            state.player.stars += 10;
            state.player.xp += 150;
            // Ganhar 1 Pacotinho de Figurinhas ao vencer o campeonato!
            state.player.packsAvailable++;

            const currIdx = CHAMPIONSHIPS.findIndex(c => c.id === state.match.championship.id);
            if (currIdx < CHAMPIONSHIPS.length - 1) {
              const nextChamp = CHAMPIONSHIPS[currIdx + 1];
              if (!state.player.unlockedChampionships.includes(nextChamp.id)) {
                state.player.unlockedChampionships.push(nextChamp.id);
              }
            }
            if (!state.player.trophies.includes(state.match.championship.id)) {
              state.player.trophies.push(state.match.championship.id);
            }
            state.match.matchFinished = true;
            saveState();
            render();
            setTimeout(() => {
              sound.speak(`É Campeão! Que golaço inesquecível de ${state.player.name}! Você ganhou um novo Pacotinho de Figurinhas!`);
            }, 500);
          } else {
            saveState();
            render();
            sound.speak(`Jogada perfeita! Vamos para o próximo lance!`);
          }
        });
      } else {
        state.match.stageAnswered = true;
        state.match.isKicking = false;
        render();
      }
    } else {
      const isGoalkeeperSave = Math.random() > 0.4;
      state.stats.byPhoneme[challenge.phoneme].errors++;
      state.stats.recentMistakes.unshift({
        word: challenge.word,
        attempted: option,
        phoneme: challenge.phoneme,
        date: 'Nesta Partida'
      });
      saveState();

      if (!state.match.eliminatedDistractors.includes(option)) {
        state.match.eliminatedDistractors.push(option);
      }

      const specificExplanation = (challenge.hint && challenge.hint.distractorExplanations && challenge.hint.distractorExplanations[option]) || '';

      if (activeSoccerCanvas) {
        const onDone = () => {
          state.match.isKicking = false;
          render();
          if (specificExplanation) {
            sound.speak(`Explodiu na trave! ${specificExplanation}`);
          } else if (isGoalkeeperSave) {
            sound.speak(`Espetacular defesa do goleiro! Tente outra alternativa ou consulte o VAR!`);
          } else {
            sound.speak(`Explodiu na trave! A bola sobrou, tente outra opção!`);
          }
        };

        if (isGoalkeeperSave) {
          activeSoccerCanvas.shootGoalkeeperSave(onDone);
        } else {
          state.stats.crossbarHits++;
          activeSoccerCanvas.shootCrossbar(onDone);
        }
      } else {
        state.match.isKicking = false;
        sound.playCrossbar();
        render();
      }
    }
  }

  function handleSyllableClick(syllable, index) {
    if (state.match.stageAnswered || state.match.isKicking) return;

    const targetSeq = state.match.syllablesTarget;
    const currentStep = state.match.syllablesSequence.length;

    if (syllable === targetSeq[currentStep]) {
      state.match.syllablesSequence.push({ syllable, index });
      sound.playKick();

      if (state.match.syllablesSequence.length === targetSeq.length) {
        // Completou a tabelinha de sílabas com perfeição!
        state.match.stageAnswered = true;
        sound.speak(`Tabelinha mágica! Cruzamento perfeito na grande área: ${state.match.currentChallenge.word}!`);
        render();
      } else {
        render();
      }
    } else {
      sound.playCrossbar();
      sound.speak(`Passe interceptado! Comece a tabelinha de novo na ordem certa!`);
      state.match.syllablesSequence = [];
      render();
    }
  }

  function activateMatchHint() {
    state.match.hintActive = true;
    state.stats.hintsUsed++;

    const challenge = state.match.currentChallenge;
    const pInfo = PHONEMES_INFO[challenge.phoneme];

    let eliminatedOne = null;
    if (challenge.hint && challenge.hint.varEliminate) {
      const extra = challenge.hint.varEliminate.find(d => !state.match.eliminatedDistractors.includes(d));
      if (extra) {
        state.match.eliminatedDistractors.push(extra);
        eliminatedOne = extra;
      }
    }

    const soundCue = challenge.hint ? challenge.hint.soundCue : pInfo.soundDescription;
    const articulatoryCue = challenge.hint ? challenge.hint.articulatoryCue : pInfo.articulatoryTip;

    showVarModal('ANÁLISE DO VAR • LANCE DECISIVO', soundCue, articulatoryCue, eliminatedOne);
    render();
  }

  function advanceMatchStage() {
    if (state.match.playStage < 4) {
      state.match.playStage++;
      loadMatchStageChallenge();
      render();
      const st = MATCH_STAGE_TITLES[state.match.playStage];
      setTimeout(() => {
        sound.speak(`Lance ${state.match.playStage + 1}: ${st.name}! ${st.desc}`);
      }, 250);
    }
  }

// ================= SIMULADOR VISUAL DO JOGO DE FUTEBOL (CANVAS 2D) =================
  class SoccerMatchCanvas {
    constructor(canvasId) {
      this.canvas = document.getElementById(canvasId);
      if (!this.canvas) return;
      this.ctx = this.canvas.getContext('2d');
      this.width = this.canvas.width = 800;
      this.height = this.canvas.height = 290;

      // Estado dos Atores
      this.ball = { x: 400, y: 220, radius: 14, vx: 0, vy: 0, rot: 0, scale: 1.0, shadowY: 300 };
      this.player = {
        x: 400, y: 260, state: 'idle', frame: 0, kickTime: 0,
        number: state.player.jerseyNumber || 10,
        color: state.player.jerseyBgHex || '#facc15',
        name: state.player.name || 'Craque'
      };
      this.keeper = { x: 400, y: 105, vx: 1.2, targetX: 400, diving: false, diveX: 0, diveY: 0 };
      this.goal = { x: 240, y: 45, width: 320, height: 70 };
      this.particles = [];
      this.shake = 0;
      this.action = null; // 'goal', 'crossbar', null
      this.animId = null;

      this.initLoop();
    }

    initLoop() {
      const loop = () => {
        this.update();
        this.render();
        this.animId = requestAnimationFrame(loop);
      };
      if (this.animId) cancelAnimationFrame(this.animId);
      this.animId = requestAnimationFrame(loop);
    }

    destroy() {
      if (this.animId) cancelAnimationFrame(this.animId);
    }

    reset() {
      this.ball = { x: 400, y: 220, radius: 14, vx: 0, vy: 0, rot: 0, scale: 1.0, shadowY: 300 };
      this.player.x = 400;
      this.player.y = 260;
      this.player.state = 'idle';
      this.keeper.x = 400;
      this.keeper.y = 105;
      this.keeper.diving = false;
      this.action = null;
      this.particles = [];
      this.shake = 0;
    }

    shootGoal(onComplete) {
      this.action = 'goal';
      this.banner = { text: '⚽ GOLAÇO NO ÂNGULO!', color: '#f59e0b', sub: 'A BOLA MORREU NA GAVETA!' };
      this.player.state = 'run_and_kick';
      this.player.kickTime = 0;
      this.trail = [];

      setTimeout(() => {
        sound.playKick();
        // Chute no ângulo esquerdo ou direito
        const targetX = Math.random() > 0.5 ? 275 : 525;
        const targetY = 60;
        this.ball.vx = (targetX - this.ball.x) / 24;
        this.ball.vy = (targetY - this.ball.y) / 24;

        // Goleiro tenta saltar, mas não alcança o ângulo
        this.keeper.diving = true;
        this.keeper.diveX = targetX > 400 ? 3.0 : -3.0;

        setTimeout(() => {
          sound.playGoalCheer();
          this.player.state = 'celebrate';
          this.shake = 8;
          this.createConfetti();
          
          // Manter a comemoração visível por 2 segundos antes de chamar onComplete
          setTimeout(() => {
            if (onComplete) onComplete();
          }, 2000);
        }, 550);
      }, 300);
    }

    shootGoalkeeperSave(onComplete) {
      this.action = 'save';
      this.banner = { text: '🧤 ESPALMA O GOLEIRO!', color: '#38bdf8', sub: 'DEFESAÇA MILAGROSA NO GOL!' };
      this.player.state = 'run_and_kick';
      this.player.kickTime = 0;
      this.trail = [];

      setTimeout(() => {
        sound.playKick();
        // A bola vai onde o goleiro consegue chegar
        const targetX = Math.random() > 0.5 ? 350 : 450;
        const targetY = 95;
        this.ball.vx = (targetX - this.ball.x) / 22;
        this.ball.vy = (targetY - this.ball.y) / 22;

        this.keeper.diving = true;
        this.keeper.diveX = (targetX - this.keeper.x) / 18;

        setTimeout(() => {
          // Goleiro espalma a bola!
          sound.playKick(); // som de espalmar
          this.shake = 6;
          this.createSparks(targetX, targetY);
          // Bola desvia para escanteio
          this.ball.vx = targetX > 400 ? 6 : -6;
          this.ball.vy = 4;
          this.player.state = 'disappointed';

          setTimeout(() => {
            if (onComplete) onComplete();
          }, 1800);
        }, 500);
      }, 300);
    }

    shootCrossbar(onComplete) {
      this.action = 'crossbar';
      this.banner = { text: '💥 EXPLODIU NA TRAVE!', color: '#ef4444', sub: 'O TRAVESSÃO BALANÇOU!' };
      this.player.state = 'run_and_kick';
      this.player.kickTime = 0;
      this.trail = [];

      setTimeout(() => {
        sound.playKick();
        const targetX = 390 + (Math.random() * 40 - 20);
        const targetY = 48;
        this.ball.vx = (targetX - this.ball.x) / 22;
        this.ball.vy = (targetY - this.ball.y) / 22;

        setTimeout(() => {
          sound.playCrossbar();
          this.shake = 16;
          this.createSparks(targetX, targetY);
          this.ball.vx = (Math.random() - 0.5) * 5;
          this.ball.vy = 6; // ricocheteia
          this.player.state = 'disappointed';

          setTimeout(() => {
            if (onComplete) onComplete();
          }, 1800);
        }, 500);
      }, 300);
    }

    createConfetti() {
      const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#ffffff', '#eab308'];
      for (let i = 0; i < 90; i++) {
        this.particles.push({
          x: 250 + Math.random() * 300,
          y: 60 + Math.random() * 40,
          vx: (Math.random() - 0.5) * 8,
          vy: -Math.random() * 7 - 2,
          size: 5 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.2,
          gravity: 0.18,
          life: 140
        });
      }
    }

    createSparks(x, y) {
      for (let i = 0; i < 25; i++) {
        this.particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 8,
          size: 3 + Math.random() * 3,
          color: '#fbbf24',
          gravity: 0.2,
          life: 30
        });
      }
    }

    update() {
      // Tremer a tela se houver impacto
      if (this.shake > 0) this.shake *= 0.85;

      // Animação do Jogador
      this.player.frame++;
      if (this.player.state === 'run_and_kick') {
        this.player.kickTime++;
        if (this.player.y > 230) this.player.y -= 2.2;
      }

      // Física da Bola
      if (this.action) {
        if (!this.trail) this.trail = [];
        this.trail.push({ x: this.ball.x, y: this.ball.y });
        if (this.trail.length > 8) this.trail.shift();

        this.ball.x += this.ball.vx;
        this.ball.y += this.ball.vy;
        this.ball.rot += 0.25;
        this.ball.scale = Math.max(0.65, 1.0 - (300 - this.ball.y) / 500);

        if (this.action === 'crossbar' && this.ball.y > 270) {
          this.ball.vy *= -0.4;
          this.ball.vx *= 0.8;
        }
      }

      // Animação do Goleiro
      if (!this.keeper.diving) {
        this.keeper.x += this.keeper.vx;
        if (this.keeper.x > 440 || this.keeper.x < 360) this.keeper.vx *= -1;
      } else {
        this.keeper.x += this.keeper.diveX;
      }

      // Atualizar Partículas
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity || 0;
        p.life--;
        if (p.life <= 0) this.particles.splice(i, 1);
      }
    }

    render() {
      const ctx = this.ctx;
      if (!ctx) return;

      ctx.save();
      if (this.shake > 0.5) {
        ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
      }

      // 1. Céu / Estádio iluminado de fundo
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 70);
      skyGrad.addColorStop(0, '#090d16');
      skyGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, this.width, 70);

      // Holofotes do Estádio
      ctx.fillStyle = 'rgba(254, 240, 138, 0.25)';
      ctx.beginPath();
      ctx.moveTo(80, 0); ctx.lineTo(250, 200); ctx.lineTo(0, 200); ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(720, 0); ctx.lineTo(550, 200); ctx.lineTo(800, 200); ctx.closePath();
      ctx.fill();

      // Placas de Publicidade e Torcida
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 55, this.width, 18);
      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚽ CRAQUES DA LEITURA FC • CAMPO OFICIAL ⚽', this.width / 2, 68);

      // 2. Gramado com faixas em perspectiva
      const pitchGrad = ctx.createLinearGradient(0, 70, 0, this.height);
      pitchGrad.addColorStop(0, '#15803d');
      pitchGrad.addColorStop(1, '#166534');
      ctx.fillStyle = pitchGrad;
      ctx.fillRect(0, 70, this.width, this.height - 70);

      // Faixas de corte da grama
      for (let y = 100; y < this.height; y += 32) {
        if ((y / 32) % 2 === 0) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
          ctx.fillRect(0, y, this.width, 32);
        }
      }

      // Linhas da Grande Área (em perspectiva)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 3;
      // Área do gol
      ctx.strokeRect(280, 95, 240, 35);
      // Grande Área
      ctx.strokeRect(190, 95, 420, 85);
      // Marca do Pênalti
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(400, 215, 4, 0, Math.PI * 2);
      ctx.fill();
      // Meia-lua da grande área
      ctx.beginPath();
      ctx.arc(400, 185, 38, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();

      // 3. A Baliza / Trave do Gol (com profundidade e rede)
      const g = this.goal;
      // Rede de trás
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(g.x + 8, g.y + 8, g.width - 16, g.height + 40);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1;
      for (let rx = g.x + 10; rx < g.x + g.width; rx += 12) {
        ctx.beginPath(); ctx.moveTo(rx, g.y + 6); ctx.lineTo(rx, g.y + g.height + 45); ctx.stroke();
      }
      for (let ry = g.y + 10; ry < g.y + g.height + 45; ry += 12) {
        ctx.beginPath(); ctx.moveTo(g.x + 8, ry); ctx.lineTo(g.x + g.width - 8, ry); ctx.stroke();
      }

      // Trave Branca Metálica (Frontal)
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      // Poste esquerdo
      ctx.moveTo(g.x, g.y + g.height + 40);
      ctx.lineTo(g.x, g.y);
      // Travessão
      ctx.lineTo(g.x + g.width, g.y);
      // Poste direito
      ctx.lineTo(g.x + g.width, g.y + g.height + 40);
      ctx.stroke();

      // 4. O Goleiro
      this.drawGoalkeeper(ctx);

      // 5. A Bola de Futebol
      this.drawBall(ctx);

      // 6. O Jogador (Craque)
      this.drawPlayer(ctx);

      // 7. Rastro de Velocidade da Bola
      if (this.action && this.trail) {
        ctx.strokeStyle = this.action === 'goal' ? 'rgba(245, 158, 11, 0.4)' : 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let i = 0; i < this.trail.length; i++) {
          const pt = this.trail[i];
          if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      }

      // 8. Partículas e Confetes
      this.drawParticles(ctx);

      // 9. Banner de Efeito (Golaço / Defesaça / Trave)
      if (this.banner && this.action) {
        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.roundRect(this.width / 2 - 180, 15, 360, 48, 12);
        ctx.fill();
        ctx.strokeStyle = this.banner.color;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = this.banner.color;
        ctx.font = 'black 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.banner.text, this.width / 2, 38);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(this.banner.sub, this.width / 2, 54);
        ctx.restore();
      }

      ctx.restore();
    }

    drawGoalkeeper(ctx) {
      const k = this.keeper;
      ctx.save();
      ctx.translate(k.x, k.y);

      // Sombra do goleiro
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 20, 16, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Corpo / Uniforme de Goleiro (Neon)
      ctx.fillStyle = '#84cc16';
      ctx.beginPath();
      ctx.roundRect(-12, -10, 24, 26, 4);
      ctx.fill();

      // Cabeça
      ctx.fillStyle = '#fbcfe8';
      ctx.beginPath();
      ctx.arc(0, -18, 9, 0, Math.PI * 2);
      ctx.fill();

      // Cabelo
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.arc(0, -21, 9, Math.PI, Math.PI * 2);
      ctx.fill();

      // Luvas de goleiro grandes (Laranja)
      ctx.fillStyle = '#f97316';
      if (k.diving) {
        ctx.beginPath(); ctx.arc(k.diveX > 0 ? 18 : -18, -12, 7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(k.diveX > 0 ? 22 : -22, -2, 7, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(-16, 2, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(16, 2, 6, 0, Math.PI * 2); ctx.fill();
      }

      ctx.restore();
    }

    drawPlayer(ctx) {
      const p = this.player;
      ctx.save();
      ctx.translate(p.x, p.y);

      // Sombra do jogador
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 25, 20, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Animação de idle (respiração suave)
      const bounce = p.state === 'idle' ? Math.sin(p.frame * 0.1) * 2 : 0;

      // Pernas e Chuteiras
      ctx.fillStyle = '#ffffff';
      // Meião esquerdo
      ctx.fillRect(-10, 8 + bounce, 7, 14);
      // Meião direito
      ctx.fillRect(3, 8 + bounce, 7, 14);
      // Chuteiras pretas com travas amarelas
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.roundRect(-12, 20 + bounce, 10, 6, 2); ctx.fill();
      ctx.beginPath(); ctx.roundRect(2, 20 + bounce, 10, 6, 2); ctx.fill();

      // Calção
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(-13, 0 + bounce, 26, 12, 3);
      ctx.fill();

      // Camisa do Jogador (Cor personalizada pelo usuário)
      ctx.fillStyle = state.player.jerseyBgHex || '#facc15';
      ctx.beginPath();
      ctx.roundRect(-15, -24 + bounce, 30, 26, 6);
      ctx.fill();

      // Número nas costas / peito da camisa
      ctx.fillStyle = '#0f172a';
      ctx.font = 'black 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.player.jerseyNumber || '10', 0, -8 + bounce);

      // Braços
      ctx.fillStyle = state.player.jerseyBgHex || '#facc15';
      if (p.state === 'celebrate') {
        // Braços erguidos comemorando!
        ctx.beginPath(); ctx.arc(-18, -32, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(18, -32, 6, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(-17, -12 + bounce, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(17, -12 + bounce, 5, 0, Math.PI * 2); ctx.fill();
      }

      // Cabeça do Craque
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.arc(0, -34 + bounce, 12, 0, Math.PI * 2);
      ctx.fill();

      // Cabelo estilizado
      ctx.fillStyle = '#292524';
      ctx.beginPath();
      ctx.arc(0, -38 + bounce, 12, Math.PI * 0.9, Math.PI * 2.1);
      ctx.fill();

      // Olhos sorridentes
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(-4, -34 + bounce, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -34 + bounce, 1.8, 0, Math.PI * 2); ctx.fill();

      // Nome do Jogador Flutuando
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.player.name || 'Craque', 0, -52 + bounce);

      ctx.restore();
    }

    drawBall(ctx) {
      const b = this.ball;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(b.scale, b.scale);

      // Sombra da bola no gramado
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 16 / b.scale, 14 * b.scale, 5 * b.scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Bola Branca
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Gomos Pretos da Bola (Girando)
      ctx.rotate(b.rot);
      ctx.fillStyle = '#0f172a';
      // Pentágono central
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI) / 5;
        const px = Math.cos(a) * 5;
        const py = Math.sin(a) * 5;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      // Gomos externos
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI) / 5;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 11, Math.sin(a) * 11, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    drawParticles(ctx) {
      this.particles.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot || 0);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
    }
  }

  function confirmOpenPack() {
    if (state.player.packsAvailable <= 0) return;
    state.player.packsAvailable--;

    sound.playPackOpening();

    // Sortear 2 cartas aleatórias
    const shuffled = [...CARDS_DATABASE].sort(() => Math.random() - 0.5);
    const card1 = shuffled[0];
    const card2 = shuffled[1];

    const results = [card1, card2].map(c => {
      const isNew = !state.player.cards.includes(c.id);
      if (isNew) {
        state.player.cards.push(c.id);
      } else {
        state.player.stars += 20; // Recompensa por figurinha repetida
      }
      return { card: c, isNew };
    });

    saveState();

    const box = document.getElementById('pack-card-box');
    if (!box) return;

    box.innerHTML = `
      <div class="space-y-4">
        <span class="text-xs font-black tracking-widest text-emerald-400 uppercase">🎉 PACOTE ABERTO COM SUCESSO!</span>
        <h3 class="font-display text-2xl text-white">SUAS NOVAS FIGURINHAS</h3>
        
        <div class="grid grid-cols-2 gap-3 pt-2">
          ${results.map(r => `
            <div class="p-3 rounded-2xl border-2 ${r.card.rarity === 'lendaria' ? 'card-legendary' : r.card.rarity === 'rara' ? 'card-rare' : 'card-common'} text-slate-950 text-center space-y-1.5 card-reveal-anim">
              <span class="text-xs font-black block">${r.isNew ? '✨ NOVA!' : '🔄 REPETIDA (+20 ⭐)'}</span>

              <p class="text-[10px] text-white/90 font-bold">${r.card.nickname}</p>
              <div class="bg-black/40 text-amber-300 text-[10px] font-black rounded py-0.5 px-1 inline-block">

              </div>
            </div>
          `).join('')}

        <p class="text-xs text-slate-300 pt-2">

        </p>

        <div class="flex gap-2 pt-2">
          ${state.player.packsAvailable > 0 ? `
            <button onclick="window.app.openPackModal()" class="touch-btn flex-1 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl text-xs shadow-md">
              🎁 Abrir Mais (${state.player.packsAvailable})

          ` : ''}

            📖 Ver no Álbum
          </button>
        </div>
      </div>
    `;

    setTimeout(() => {
      sound.playCardReveal();
      sound.speak(`Incrível! Você tirou ${card1.name} e ${card2.name}!`);
    }, 400);
  }

  function renderWordWithGap(q, isAnswered) {
    if (isAnswered) {
      if (state.settings.showSyllableColors) {
        return q.syllables.map((s, idx) => `
          <span class="syl-${idx % 4} font-display text-3xl sm:text-4xl px-3 py-1 font-bold">${s}</span>
        `).join('');
      }
      return `<span class="font-display text-3xl sm:text-4xl text-slate-900 font-bold">${q.word}</span>`;
    }

    const wordDisplay = q.word.replace(q.missingPart, ' ___ ');
    return `
      <span class="font-display text-3xl sm:text-4xl text-slate-800 tracking-wider font-black">
        ${wordDisplay.replace('___', '<span class="text-amber-600 underline decoration-amber-500 decoration-wavy px-2 bg-amber-100 rounded-lg"> ? </span>')}
      </span>
    `;
  }

              🗣️ <span>Técnico</span>

        <div id="match-card" class="bg-white rounded-2xl p-3 border-2 border-slate-800 shadow-md space-y-2 ${state.settings.readingRuler ? 'reading-ruler-guide' : ''}">
          
          <div class="flex flex-wrap items-center justify-between gap-2 px-1">
            <div class="space-y-0.5">
              <span class="text-[11px] font-black text-amber-700 uppercase tracking-wider block">
                ${stageInfo.desc}
              </span>

              ${state.match.stageType === 'initial_sound' ? `
                <p class="reading-text font-bold text-slate-900 text-sm sm:text-base leading-tight">
                  Identifique o som inicial para roubar a bola na palavra: 
                  <strong class="text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">${challenge.word}</strong>
                </p>
              ` : state.match.stageType === 'minimal_pair' ? `
                <div class="flex items-center gap-2">
                  <p class="reading-text font-bold text-slate-900 text-sm sm:text-base leading-tight">
                    Ouça com atenção o narrador e escolha o caminho do drible!
                  </p>
                  <button onclick="window.app.speakWord('Drible para o lado de: ${challenge.word}')" class="touch-btn px-2 py-1 bg-amber-100 text-amber-900 rounded-lg text-xs font-bold border border-amber-300">
                    🔊 Ouvir Drible
                  </button>
                </div>
              ` : state.match.stageType === 'syllable_shuffle' ? `
                <p class="reading-text font-bold text-slate-900 text-sm sm:text-base leading-tight">
                  Toque nas sílabas na ordem para fazer a tabelinha de passes: 
                  <span class="text-emerald-700 font-black">${challenge.word}</span>
                </p>
              ` : `
                <p class="reading-text font-bold text-slate-800 text-sm sm:text-base leading-tight">
                  "${challenge.sentenceMissing.replace('_____', '<span class="text-amber-600 underline decoration-amber-500 decoration-wavy px-2 bg-amber-100 rounded"> ? </span>')}"
                </p>
              `}
            </div>

            ${!state.match.hintActive && !state.match.stageAnswered ? `
              <button onclick="window.app.activateMatchHint()" class="touch-btn px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 font-bold rounded-lg text-xs flex items-center gap-1">
                🎥 <span>VAR</span>
              </button>
            ` : state.match.hintActive ? `
              <div class="tactical-board px-2.5 py-1 rounded-xl text-white text-xs max-w-sm">
                <span class="text-amber-300 font-bold">VAR:</span> ${challenge.hint ? challenge.hint.soundCue : 'Ouça a palavra!'}
              </div>
            ` : ''}
          </div>

          <!-- RENDERIZAÇÃO DA MECÂNICA ESPECÍFICA -->
          ${!state.match.stageAnswered ? (
            state.match.stageType === 'syllable_shuffle' ? `
              <!-- LANCE 4: TABELINHA DE SÍLABAS (ORDENAÇÃO) -->
              <div class="space-y-3 pt-2">
                <!-- Linha de Conexão dos Passes -->
                <div class="flex items-center justify-center gap-2 p-3 bg-slate-950 rounded-xl border border-slate-800">
                  <span class="text-xs text-amber-400 font-black mr-2">PASSES:</span>
                  ${state.match.syllablesTarget.map((s, idx) => {
                    const isDone = idx < state.match.syllablesSequence.length;
                    return `
                      <div class="px-3 py-1.5 rounded-lg font-display text-lg font-bold ${isDone ? 'bg-emerald-500 text-slate-950 animate-bounce' : 'bg-slate-800 text-slate-400 border border-dashed border-slate-600'} flex items-center gap-1">
                        <span>${isDone ? '⚽' : '⏳'}</span>
                        <span>${isDone ? s : '?'}</span>
                      </div>
                      ${idx < state.match.syllablesTarget.length - 1 ? '<span class="text-slate-600 font-black">➔</span>' : ''}
                    `;
                  }).join('')}
                </div>

                <!-- Botões das Sílabas Embaralhadas -->
                <div class="flex flex-wrap items-center justify-center gap-3">
                  ${state.match.syllablesShuffled.map((syl, idx) => {
                    const alreadyUsed = state.match.syllablesSequence.some(item => item.index === idx);
                    if (alreadyUsed) {
                      return `
                        <div class="px-5 py-3 rounded-2xl bg-emerald-100 border-2 border-emerald-400 text-emerald-800 font-display text-2xl font-black opacity-50">
                          ✅ ${syl}
                        </div>
                      `;
                    }
                    return `
                      <button onclick="window.app.handleSyllableClick('${syl}', ${idx})" class="touch-btn px-6 py-3.5 rounded-2xl bg-gradient-to-b from-amber-400 to-amber-500 hover:from-amber-300 text-slate-950 font-display text-2xl tracking-wider border-2 border-amber-600 shadow-lg transform active:scale-95 transition-all syllable-node">
                        ⚽ ${syl}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : `
              <!-- DEMAIS LANCES (MÚLTIPLA ESCOLHA COM BOTÕES DE CHUTE) -->
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1">
                ${state.match.challengeOptions.map(opt => {
                  const isEliminated = state.match.eliminatedDistractors.includes(opt);
                  if (isEliminated) {
                    return `
                      <div class="p-2.5 rounded-xl bg-slate-100 border border-dashed border-slate-300 text-slate-400 font-display text-xl text-center line-through opacity-40 flex items-center justify-center">
                        ❌ ${opt}
                      </div>
                    `;
                  }
                  return `
                    <button onclick="window.app.checkMatchAnswer('${opt}')" class="touch-btn p-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-display text-2xl tracking-wider border-2 border-amber-500 shadow-md transform active:scale-95 transition-all flex items-center justify-center gap-2">
                      <span>⚽</span> <span>${opt}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            `
          ) : `
            <div class="bg-emerald-900/90 text-white rounded-xl p-2.5 flex items-center justify-between gap-3 animate-goal">
              <div class="text-left">
                <span class="font-bold text-sm block">⚡ LANCE PERFEITO!</span>
                <span class="text-xs text-emerald-200">${challenge.fullSentence}</span>
              </div>
              <button onclick="window.app.advanceMatchStage()" class="touch-btn px-5 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl text-xs sm:text-sm shadow-md">
                ${stage === 4 ? 'GOLAÇO! ➔' : 'CONTINUAR ➔'}
              </button>
            </div>
          `}
        </div>
      </div>
    `;
  }

  function render() {
    const root = document.getElementById('app-root');
    if (!root) return;

    let content = '';
    switch (state.activeScreen) {
      case 'home':
        content = renderHomeScreen();
        break;
      case 'training_list':
        content = renderTrainingListScreen();
        break;
      case 'training_game':
        content = renderTrainingGameScreen();
        break;
      case 'match':
        content = renderMatchScreen();
        break;
      case 'album':
        content = renderAlbumScreen();
        break;
      case 'coach_dashboard':
        content = renderCoachDashboardScreen();
        break;
      case 'locker_room':
        content = renderLockerRoomScreen();
        break;
      default:
        content = renderHomeScreen();
    }

    root.innerHTML = renderHeader() + '<main class="pb-12">' + content + '</main>';
  }

  // ================= API GLOBAL (WINDOW.APP) =================
  window.app = {
    state,
    sound,
    navigateTo,
    speakWord: (text) => sound.speak(text),
    speakSyllables: (arr) => sound.speakSyllables(arr),
    speakCoachHint: (word, meaning) => {
      sound.playTacticalHint();
      sound.speak(`A palavra é ${word}! Dica do professor: ${meaning}`);
    },
    checkTrainingAnswer,
    activateTrainingHint,
    nextTrainingQuestion,
    checkMatchAnswer,
    activateMatchHint,
    advanceMatchStage,
    handleSyllableClick,
    openPackModal,
    confirmOpenPack,
    inspectCard,
    setAlbumFilter: (f) => {
      state.albumFilter = f;
      render();
    },
    toggleReadingRuler: () => {
      state.settings.readingRuler = !state.settings.readingRuler;
      saveState();
      render();
      sound.speak(`Régua de leitura ${state.settings.readingRuler ? 'ativada' : 'desativada'}`);
    },
    toggleAudioSpeed: () => {
      state.settings.audioSpeed = state.settings.audioSpeed < 1.0 ? 1.0 : 0.8;
      sound.setSpeechRate(state.settings.audioSpeed);
      saveState();
      render();
      sound.speak(`Velocidade da voz alterada para ${state.settings.audioSpeed < 1.0 ? 'lenta' : 'normal'}`);
    },
    toggleSyllableColors: () => {
      state.settings.showSyllableColors = !state.settings.showSyllableColors;
      saveState();
      render();
    },
    toggleMute: () => {
      sound.isMuted = !sound.isMuted;
      render();
    },
    setJerseyNumber: (num) => {
      state.player.jerseyNumber = num;
      render();
    },
    setJerseyColor: (cls, hex) => {
      state.player.jerseyColor = cls;
      state.player.jerseyBgHex = hex;
      render();
    },
    savePlayerProfile: () => {
      const input = document.getElementById('player-name-input');
      if (input && input.value.trim()) {
        state.player.name = input.value.trim();
      }
      saveState();
      sound.speak(`Perfil do craque ${state.player.name} atualizado com sucesso!`);
      navigateTo('home');
    }
  };

  function startApp() {
    try {
      loadStoredState();
      render();
    } catch(e) {
      console.error('Erro ao iniciar:', e);
      const root = document.getElementById('app-root');
      if (root) root.innerHTML = '<div style="padding:30px;color:red;font-size:18px;">Erro ao iniciar: ' + e.message + '</div>';
    }
  }

  startApp();
})();

document.addEventListener('click', () => {
  if (window.app && window.app.sound) window.app.sound.unlockAudio();
}, { once: false });

document.addEventListener('touchstart', () => {
  if (window.app && window.app.sound) window.app.sound.unlockAudio();
}, { once: false });

  </script>
</body>
</html>
